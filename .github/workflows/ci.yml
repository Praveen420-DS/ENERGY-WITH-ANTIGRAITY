name: CI

on:
  push:
  pull_request:

jobs:
  backend-ml-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eps_test
          POSTGRES_PASSWORD: ci-ephemeral-postgres-password
          POSTGRES_DB: energy_prediction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eps_test -d energy_prediction_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
      - run: pip install -r backend/requirements.txt
      - name: Validate PostgreSQL migrations
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://eps_test:ci-ephemeral-postgres-password@localhost:5432/energy_prediction_test
          MIGRATION_DATABASE_URL: postgresql+psycopg2://eps_test:ci-ephemeral-postgres-password@localhost:5432/energy_prediction_test
      - run: pytest backend/tests tests -q --ignore=backend/tests/test_electricity_candidate_integration.py --ignore=tests/test_phase2_electricity_candidate_package.py
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://eps_test:ci-ephemeral-postgres-password@localhost:5432/energy_prediction_test
          JWT_SECRET_KEY: ci-only-jwt-secret-not-for-deployment-0123456789abcdef
          LOKY_MAX_CPU_COUNT: "1"

  candidate-model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - run: pip install -r backend/requirements.txt
      - name: Install candidate artifact runtime
        run: |
          python -c "import json; from pathlib import Path; p=Path('models/candidates/v2.0.0-electricity/requirements.json'); packages=json.loads(p.read_text())['python_packages']; print('\\n'.join(f'{name}=={version}' for name,version in packages.items()))" > candidate-requirements.txt
          pip install -r candidate-requirements.txt
      - run: pytest backend/tests/test_electricity_candidate_integration.py tests/test_phase2_electricity_candidate_package.py -q

  frontend-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build:
    runs-on: ubuntu-latest
    needs:
      - backend-ml-tests
      - candidate-model-tests
      - frontend-validation
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend and frontend images
        run: docker compose -f docker/docker-compose.yml build backend frontend
