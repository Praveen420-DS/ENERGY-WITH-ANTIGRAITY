events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=prediction_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    map $uri $route_csp {
        default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'";
        ~^/docs$ "default-src 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'";
        ~^/static/swagger-ui/ "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'";
        ~^/openapi\.json$ "default-src 'none'; base-uri 'none'; frame-ancestors 'none'";
        ~^/api/ "default-src 'none'; base-uri 'none'; frame-ancestors 'none'";
        ~^/health$ "default-src 'none'; base-uri 'none'; frame-ancestors 'none'";
        ~^/redoc$ "default-src 'none'; base-uri 'none'; frame-ancestors 'none'";
        ~^/(models|data|backend|ml_service|scripts)(/|$) "default-src 'none'; base-uri 'none'; frame-ancestors 'none'";
        ~^/\. "default-src 'none'; base-uri 'none'; frame-ancestors 'none'";
    }

    upstream backend_api {
        server backend:8000;
    }

    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 64k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $route_csp always;

        error_page 413 = @payload_too_large;
        error_page 429 = @rate_limited;

        location @payload_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body exceeds the permitted size."}}';
        }

        location @rate_limited {
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please retry later."}}';
        }

        location = /api/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location = /api/auth/register {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location = /api/predictions/health {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 15s;
        }

        location /api/predictions/ {
            limit_req zone=prediction_limit burst=20 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location = /docs {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 15s;
        }

        location = /redoc {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 15s;
        }

        location = /openapi.json {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 15s;
        }

        location /static/swagger-ui/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 15s;
        }

        location = /health {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 15s;
        }

        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            try_files $uri =404;
        }

        location ~ ^/(models|data|backend|ml_service|scripts)(/|$) {
            return 404;
        }

        location ~ /\. {
            return 404;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
