# ================================================
# Docker Compose â€” Base Configuration
# ================================================
# Usage: docker compose -f docker-compose.yml up --build

services:

  # --- Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: eps-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_build:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    networks:
      - eps-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Frontend (React) ---
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: eps-frontend
    volumes:
      - frontend_build:/output
    networks:
      - eps-network
    restart: "no"

  # --- Backend (FastAPI) ---
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: eps-backend
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - eps-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/predictions/health', timeout=5)",
        ]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s

  # --- Database Migrations ---
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eps-network
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # --- Celery Worker ---
  celery-worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: eps-celery-worker
    command: celery -A tasks.celery_app:celery_app worker --loglevel=info
    env_file:
      - ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - eps-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # --- Celery Beat (Scheduler) ---
  celery-beat:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: eps-celery-beat
    command: celery -A tasks.celery_app:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eps-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: eps-postgres
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/10-init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    networks:
      - eps-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # --- Redis ---

  redis:
    image: redis:7-alpine
    container_name: eps-redis
    env_file:
      - ../.env
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eps-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
volumes:
  postgres_data:
  redis_data:
  frontend_build:

networks:
  eps-network:
    driver: bridge
