# ================================================
# Docker Compose — Base Configuration
# ================================================
# Usage: docker compose -f docker-compose.yml up --build

version: "3.9"

services:

  # --- Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: eps-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_build:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - eps-network
    restart: unless-stopped

  # --- Frontend (React) ---
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: eps-frontend
    volumes:
      - frontend_build:/app/dist
    networks:
      - eps-network

  # --- Backend (FastAPI) ---
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: eps-backend
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - redis
    networks:
      - eps-network
    restart: unless-stopped

  # --- Celery Worker ---
  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: eps-celery-worker
    command: celery -A tasks.celery_app worker --loglevel=info
    env_file:
      - ../.env
    depends_on:
      - mongo
      - redis
    networks:
      - eps-network
    restart: unless-stopped

  # --- Celery Beat (Scheduler) ---
  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: eps-celery-beat
    command: celery -A tasks.celery_app beat --loglevel=info
    env_file:
      - ../.env
    depends_on:
      - redis
    networks:
      - eps-network
    restart: unless-stopped

  # --- MongoDB ---
  mongo:
    image: mongo:7
    container_name: eps-mongo
    env_file:
      - ../.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
    networks:
      - eps-network
    restart: unless-stopped

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: eps-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eps-network
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  frontend_build:

networks:
  eps-network:
    driver: bridge
