# ================================================
# Docker Compose — Base Configuration
# ================================================
# Usage: docker compose -f docker-compose.yml up --build

version: "3.9"

services:

  # --- Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: eps-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_build:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - eps-network
    restart: unless-stopped

  # --- Frontend (React) ---
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: eps-frontend
    volumes:
      - frontend_build:/app/dist
    networks:
      - eps-network

  # --- Backend (FastAPI) ---
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: eps-backend
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - eps-network
    restart: unless-stopped

  # --- Celery Worker ---
  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: eps-celery-worker
    command: celery -A tasks.celery_app worker --loglevel=info
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
    networks:
      - eps-network
    restart: unless-stopped

  # --- Celery Beat (Scheduler) ---
  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: eps-celery-beat
    command: celery -A tasks.celery_app beat --loglevel=info
    env_file:
      - ../.env
    depends_on:
      - redis
    networks:
      - eps-network
    restart: unless-stopped

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: eps-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eps-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: eps-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eps-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  frontend_build:

networks:
  eps-network:
    driver: bridge
