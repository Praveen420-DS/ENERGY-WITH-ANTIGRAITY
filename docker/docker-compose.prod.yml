# ================================================
# Docker Compose — Production Overrides
# ================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.9"

services:

  backend:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    environment:
      - DEBUG=false
      - APP_ENV=production

  celery-worker:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  nginx:
    ports:
      - "80:80"
      - "443:443"

  mongo:
    ports: []  # Do not expose to host in production
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    ports: []  # Do not expose to host in production
