# ================================================
# Docker Compose — Production Overrides
# ================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  backend:
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    environment:
      - DEBUG=false
      - APP_ENV=production
      - API_DOCS_ENABLED=false

  celery-worker:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  nginx:
    ports:
      - "80:80"

  postgres:
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    ports: !reset []
